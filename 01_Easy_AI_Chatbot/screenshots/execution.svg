<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520"><rect width="900" height="520" fill="#181818"/><text x="35" y="50" fill="white" font-family="monospace" font-size="24">PROJECT EXECUTION — AI CHATBOT</text><text x="35" y="105" fill="#ddd" font-family="monospace" font-size="20">You: hello</text><text x="35" y="140" fill="#ddd" font-family="monospace" font-size="20">Bot: Hello! How can I help you?</text><text x="35" y="195" fill="#ddd" font-family="monospace" font-size="20">You: what is your name</text><text x="35" y="230" fill="#ddd" font-family="monospace" font-size="20">Bot: I am a simple rule-based AI chatbot.</text><text x="35" y="285" fill="#ddd" font-family="monospace" font-size="20">You: how are you</text><text x="35" y="320" fill="#ddd" font-family="monospace" font-size="20">Bot: I am doing well. Thanks for asking!</text><text x="35" y="375" fill="#ddd" font-family="monospace" font-size="20">You: bye</text><text x="35" y="410" fill="#ddd" font-family="monospace" font-size="20">Bot: Goodbye! Have a great day.</text></svg>